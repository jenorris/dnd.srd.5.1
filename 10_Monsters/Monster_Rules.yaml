size_categories:
- size: Tiny
  space: 2½ by 2½ ft.
  examples: Imp, sprite
- size: Small
  space: 5 by 5 ft.
  examples: Giant rat, goblin
- size: Medium
  space: 5 by 5 ft.
  examples: Orc, werewolf
- size: Large
  space: 10 by 10 ft.
  examples: Hippogriff, ogre
- size: Huge
  space: 15 by 15 ft.
  examples: Fire giant, treant
- size: Gargantuan
  space: 20 by 20 ft. or larger
  examples: Kraken, purple worm
hit_dice_by_size:
